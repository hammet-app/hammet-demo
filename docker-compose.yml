version: "3.9"

services:
  frontend:
    build:
      context: .
      target: deps        # stop at deps stage, skip the full prod build
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true   # fixes hot-reload on Windows/WSL2
    command: npm run dev